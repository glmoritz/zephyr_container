#
# ESP32-C6 built-in USB-JTAG for Zephyr RTOS debugging.
#
# The ESP32-C6 is a single-core RISC-V part, so the "Zephyr" RTOS-awareness
# plugin works here — the SMP (dual-core) crash that forces "hwthread" on the
# ESP32-S3 does not apply. Switch to "hwthread" if you ever hit RTOS-plugin
# issues; breakpoints/stepping/registers work either way.

source [find interface/esp_usb_jtag.cfg]

set ESP_RTOS "Zephyr"

source [find target/esp32c6.cfg]
